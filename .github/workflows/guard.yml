name: guard
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  no-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: reject credential filenames and token-shaped blobs
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(auth\.json|mcp_credentials\.json|\.env|id_rsa|id_ed25519)$'; then
            echo "forbidden credential filename staged" >&2
            exit 1
          fi
          if git grep -nE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!.github/workflows/guard.yml'; then
            echo "token-shaped string in tree" >&2
            exit 1
          fi
          echo "guard ok"
